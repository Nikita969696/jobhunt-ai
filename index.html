<script>

const API_URL =
  'https://rapid-wood-80b6.fetis969696.workers.dev/jobs';

const COUNTRY = 'gb';

let jobs = [];
let currentFilter = 'all';

let saved = JSON.parse(
  localStorage.getItem('jobhunt_saved') || '[]'
);


/* =========================
   ИКОНКА ВАКАНСИИ
========================= */

function getIcon(job){

  const text = (
    job.title + ' ' +
    job.type + ' ' +
    job.category
  ).toLowerCase();

  if(text.includes('design')) return '🎨';
  if(text.includes('photo')) return '📸';
  if(text.includes('video')) return '🎬';
  if(text.includes('developer')) return '💻';
  if(text.includes('software')) return '💻';
  if(text.includes('marketing')) return '📱';
  if(text.includes('social')) return '📱';
  if(text.includes('copy')) return '✍️';
  if(text.includes('data')) return '📊';
  if(text.includes('finance')) return '💰';

  return '💼';
}


/* =========================
   MATCH SCORE
========================= */

function getMatch(job){

  const q =
    document
      .getElementById('keywordSearch')
      ?.value
      .toLowerCase()
      .trim() || '';

  if(!q) return 85;

  const text = (
    job.title + ' ' +
    job.description + ' ' +
    job.category
  ).toLowerCase();

  if(job.title.toLowerCase().includes(q)){
    return 96;
  }

  if(text.includes(q)){
    return 90;
  }

  return 82;
}


/* =========================
   ЗАРПЛАТА
========================= */

function formatMoney(job){

  const min = Number(job.salary_min || 0);
  const max = Number(job.salary_max || 0);

  if(!min && !max){
    return 'Зарплата не указана';
  }

  let symbol = '£';

  if(COUNTRY === 'de' ||
     COUNTRY === 'fr' ||
     COUNTRY === 'nl' ||
     COUNTRY === 'ie' ||
     COUNTRY === 'it' ||
     COUNTRY === 'es' ||
     COUNTRY === 'pl'){

    symbol = '€';
  }

  if(min && max){
    return `${symbol}${Math.round(min).toLocaleString()}–${symbol}${Math.round(max).toLocaleString()}`;
  }

  if(min){
    return `от ${symbol}${Math.round(min).toLocaleString()}`;
  }

  return `до ${symbol}${Math.round(max).toLocaleString()}`;
}


/* =========================
   ДАТА
========================= */

function isToday(date){

  if(!date) return false;

  const d = new Date(date);
  const now = new Date();

  return (
    d.getFullYear() === now.getFullYear() &&
    d.getMonth() === now.getMonth() &&
    d.getDate() === now.getDate()
  );
}


function formatDate(date){

  if(!date) return 'Дата не указана';

  const d = new Date(date);

  return d.toLocaleDateString('ru-RU',{
    day:'2-digit',
    month:'2-digit',
    year:'numeric'
  });
}


/* =========================
   REMOTE
========================= */

function isRemote(job){

  const text = (
    job.title + ' ' +
    job.description + ' ' +
    job.location
  ).toLowerCase();

  return (
    text.includes('remote') ||
    text.includes('work from home') ||
    text.includes('working from home') ||
    text.includes('hybrid')
  );
}


/* =========================
   ЗАГРУЗКА ВАКАНСИЙ
========================= */

async function loadJobs(){

  const home =
    document.getElementById('cards');

  const search =
    document.getElementById('searchCards');

  const loading = `
    <div class="empty">
      ⏳ Загружаем реальные вакансии...
    </div>
  `;

  if(home) home.innerHTML = loading;
  if(search) search.innerHTML = loading;

  try{

    const q =
      document
        .getElementById('keywordSearch')
        ?.value
        .trim() || 'designer';

    const url =
      `${API_URL}?country=${encodeURIComponent(COUNTRY)}&what=${encodeURIComponent(q)}`;

    const response = await fetch(url);

    if(!response.ok){
      throw new Error('Ошибка API: ' + response.status);
    }

    const data = await response.json();

    if(!data.ok){
      throw new Error(data.error || 'Ошибка сервера');
    }

    jobs = (data.jobs || []).map((job, index) => {

      const location =
        job.location?.display_name ||
        'Location not specified';

      const company =
        job.company?.display_name ||
        'Компания не указана';

      const description =
        job.description ||
        'Описание вакансии отсутствует.';

      return {

        id: String(
          job.id ||
          `${index}-${job.title}`
        ),

        icon: getIcon({
          title: job.title || '',
          type: job.category?.label || '',
          category: job.category?.tag || ''
        }),

        title:
          job.title || 'Без названия',

        money:
          formatMoney(job),

        location,

        company,

        description,

        category:
          job.category?.label || '',

        type:
          job.category?.tag || '',

        remote:
          isRemote({
            title: job.title || '',
            description,
            location
          }),

        today:
          isToday(job.created),

        created:
          job.created,

        redirect_url:
          job.redirect_url || '',

        match:
          85
      };

    });

    renderHome();
    renderSearch();
    renderSaved();

  }catch(error){

    console.error(error);

    const errorHtml = `
      <div class="empty">
        ❌ Не удалось загрузить вакансии.
        <br><br>
        Проверь соединение с сервером.
        <br><br>
        <button
          class="btn"
          onclick="loadJobs()">
          Повторить
        </button>
      </div>
    `;

    if(home) home.innerHTML = errorHtml;
    if(search) search.innerHTML = errorHtml;
  }
}


/* =========================
   КАРТОЧКА
========================= */

function card(job){

  const isSaved =
    saved.includes(job.id);

  const match =
    job.match || getMatch(job);

  return `

    <div
      class="card"
      onclick="openJob('${escapeAttr(job.id)}')">

      <div class="row">

        <div class="thumb">
          ${job.icon}
        </div>

        <div class="grow">

          <span class="tag">
            ${match}% match
          </span>

          <div class="title">
            ${escapeHtml(job.title)}
          </div>

          <div class="meta">
            ${escapeHtml(job.company)}
          </div>

          <div class="meta">
            📍 ${escapeHtml(job.location)}
          </div>

        </div>

      </div>

      <div class="money">

        ${escapeHtml(job.money)}

        <span class="match">
          ${isSaved ? '♥' : '♡'}
        </span>

      </div>

    </div>

  `;
}


/* =========================
   ГЛАВНАЯ
========================= */

function renderHome(){

  const container =
    document.getElementById('cards');

  if(!container) return;

  if(!jobs.length){

    container.innerHTML = `
      <div class="empty">
        Вакансий пока нет.
      </div>
    `;

    return;
  }

  container.innerHTML =
    jobs
      .slice(0,3)
      .map(job => card(job))
      .join('');
}


/* =========================
   ПОИСК
========================= */

function renderSearch(){

  const container =
    document.getElementById('searchCards');

  if(!container) return;

  const filtered =
    getFilteredJobs();

  if(!filtered.length){

    container.innerHTML = `
      <div class="empty">
        😕 Ничего не найдено.
        <br><br>
        Попробуй другое ключевое слово.
      </div>
    `;

    return;
  }

  container.innerHTML =
    filtered
      .map(job => card(job))
      .join('');
}


/* =========================
   ФИЛЬТРАЦИЯ
========================= */

function getFilteredJobs(){

  const q =
    document
      .getElementById('keywordSearch')
      .value
      .toLowerCase()
      .trim();

  return jobs.filter(job => {

    const text = (

      job.title + ' ' +
      job.location + ' ' +
      job.company + ' ' +
      job.type + ' ' +
      job.description

    ).toLowerCase();

    const matchesSearch =
      !q || text.includes(q);

    let matchesFilter = true;

    if(currentFilter === 'remote'){
      matchesFilter = job.remote;
    }

    if(currentFilter === 'today'){
      matchesFilter = job.today;
    }

    if(currentFilter === 'high'){

      const salary =
        Number(job.salary_min || 0);

      matchesFilter =
        salary >= 500;
    }

    return (
      matchesSearch &&
      matchesFilter
    );

  });
}


/* =========================
   ПОИСК
========================= */

function filterJobs(){

  const q =
    document
      .getElementById('keywordSearch')
      .value
      .trim();

  if(q.length >= 2){

    loadJobs();

  }else{

    renderSearch();

  }
}


/* =========================
   ФИЛЬТРЫ
========================= */

function setFilter(filter,el){

  currentFilter = filter;

  document
    .querySelectorAll('.chip')
    .forEach(x =>
      x.classList.remove('active')
    );

  el.classList.add('active');

  renderSearch();
}


/* =========================
   ОТКРЫТИЕ ВАКАНСИИ
========================= */

function openJob(id){

  const j =
    jobs.find(x => x.id === id);

  if(!j) return;

  const isSaved =
    saved.includes(j.id);

  const match =
    j.match || getMatch(j);

  const description =
    j.description
      .replace(/<[^>]*>/g,' ')
      .replace(/\s+/g,' ')
      .trim();

  document
    .getElementById('detailContent')
    .innerHTML = `

      <div class="tag">
        ${match}% MATCH
      </div>

      <h1>
        ${escapeHtml(j.title)}
      </h1>

      <div class="meta">
        🏢 ${escapeHtml(j.company)}
      </div>

      <div class="meta">
        📍 ${escapeHtml(j.location)}
      </div>

      <div class="meta">
        🕒 ${formatDate(j.created)}
      </div>

      <div class="money">
        ${escapeHtml(j.money)}
      </div>


      <div class="box">

        <b>
          Почему подходит тебе
        </b>

        <p>
          AI оценил соответствие этой
          вакансии в ${match}%.
        </p>

        <div class="score">
          ${match}%
        </div>

        <small style="color:#9ca9c8">
          AI Match Score
        </small>

      </div>


      <div class="box">

        <b>
          Описание вакансии
        </b>

        <p>
          ${escapeHtml(description)}
        </p>

      </div>


      <button
        class="btn"
        style="width:100%;margin-bottom:10px"
        onclick="openOriginalJob('${escapeAttr(j.id)}')">

        🔗 Открыть вакансию

      </button>


      <button
        class="btn secondary"
        style="width:100%;margin-bottom:10px"
        onclick="show('apply')">

        ✨ AI подготовит отклик

      </button>


      <button
        class="btn secondary"
        style="width:100%"
        onclick="toggleSave('${escapeAttr(j.id)}')">

        ${isSaved
          ? '♥ Убрать из сохранённых'
          : '♡ Сохранить'}

      </button>


      <div
        style="
          margin-top:14px;
          text-align:center;
          font-size:11px;
          color:#8292b5;
        "
      >
        Jobs by Adzuna
      </div>

    `;

  show('detail');
}


/* =========================
   ОТКРЫТЬ ИСТОЧНИК
========================= */

function openOriginalJob(id){

  const j =
    jobs.find(x => x.id === id);

  if(!j || !j.redirect_url) return;

  window.open(
    j.redirect_url,
    '_blank',
    'noopener,noreferrer'
  );
}


/* =========================
   СОХРАНЕНИЕ
========================= */

function toggleSave(id){

  if(saved.includes(id)){

    saved =
      saved.filter(x => x !== id);

  }else{

    saved.push(id);

  }

  localStorage.setItem(
    'jobhunt_saved',
    JSON.stringify(saved)
  );

  document
    .getElementById('savedCount')
    .innerText = saved.length;

  renderSaved();

  openJob(id);
}


/* =========================
   СОХРАНЁННЫЕ
========================= */

function renderSaved(){

  const container =
    document.getElementById('savedCards');

  if(!container) return;

  const savedJobs =
    saved
      .map(id =>
        jobs.find(job => job.id === id)
      )
      .filter(Boolean);

  if(!savedJobs.length){

    container.innerHTML = `
      <div class="empty">
        Пока ничего не сохранено.
        <br><br>
        Нажми ♡ на интересной возможности.
      </div>
    `;

    return;
  }

  container.innerHTML =
    savedJobs
      .map(job => card(job))
      .join('');
}


/* =========================
   КОПИРОВАНИЕ
========================= */

function copyMessage(){

  const text =
    document
      .getElementById('msg')
      .innerText;

  navigator.clipboard?.writeText(text);

  alert('Сообщение скопировано ✅');
}


/* =========================
   НАВИГАЦИЯ
========================= */

function show(id,el){

  document
    .querySelectorAll('.screen')
    .forEach(x =>
      x.classList.remove('active')
    );

  document
    .getElementById(id)
    .classList.add('active');

  if(el){

    document
      .querySelectorAll('.nav')
      .forEach(x =>
        x.classList.remove('active')
      );

    el.classList.add('active');
  }

  if(id === 'search'){
    renderSearch();
  }

  if(id === 'saved'){
    renderSaved();
  }

  window.scrollTo(0,0);
}


/* =========================
   БЕЗОПАСНЫЙ HTML
========================= */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


function escapeAttr(value){

  return String(value ?? '')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");
}


/* =========================
   СТАРТ
========================= */

document
  .getElementById('savedCount')
  .innerText = saved.length;


/* Загружаем реальные вакансии */

loadJobs();

</script>
